name: Extract Website

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: فك كل ملفات الزيب في جذر المشروع
        run: |
          shopt -s globstar nullglob
          for f in **/*.zip; do
            echo "Extracting: $f"
            unzip -o "$f" -d "$(dirname "$f")"
          done

      - name: نقل الملفات لو كانت داخل مجلد فرعي إلى الجذر
        run: |
          for d in */; do
            if [ -f "${d}index.html" ]; then
              echo "Moving contents of $d to root"
              shopt -s dotglob
              mv "${d}"* .
              rmdir "$d" 2>/dev/null || true
            fi
          done

      - name: حذف ملفات الزيب بعد فكها
        run: find . -maxdepth 3 -name "*.zip" -delete

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "فك الموقع وتجهيزه تلقائياً"
          git push

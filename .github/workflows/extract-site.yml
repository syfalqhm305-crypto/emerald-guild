name: Extract Website

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract website
        run: |
          rm -rf .site_extract
          unzip -q emerald_guild_connected.zip -d .site_extract
          cp -a .site_extract/emerald_site/. .
          rm -rf .site_extract
          rm -f emerald_guild_connected.zip

      - name: Save website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract website files"
          git push

name: Auto Unzip

on:
  push:
    paths:
      - '**.zip'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract any uploaded zip
        run: |
          shopt -s nullglob
          for f in *.zip; do
            echo "Extracting: $f"
            rm -rf _tmp_extract
            mkdir _tmp_extract
            unzip -o "$f" -d _tmp_extract

            entries=(_tmp_extract/*)
            if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
              shopt -s dotglob
              mv "${entries[0]}"/* .
              shopt -u dotglob
            else
              shopt -s dotglob
              mv _tmp_extract/* .
              shopt -u dotglob
            fi

            rm -rf _tmp_extract
            rm -f "$f"
          done

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "🗜️ فك الملف المضغوط تلقائيًا"
          git push

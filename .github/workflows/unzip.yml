name: فك الزيب تلقائياً

on:
  push:
    paths:
      - '**.zip'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: فك الملفات
        run: |
          shopt -s globstar nullglob
          for f in **/*.zip; do
            unzip -o "$f" -d "$(dirname "$f")"
            rm "$f"
          done

      - name: حفظ ورفع النتيجة
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "فك الزيب تلقائياً"
          git push

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=768, viewport-fit=cover">
<title>بنك النقابة | Emerald Bank</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css?v=5">
<style>
  .balance-card{ text-align:center; padding:26px 18px; position:relative; overflow:hidden; }
  .balance-card::before{ content:""; position:absolute; inset:0; background:radial-gradient(circle at 50% 0%, rgba(45,212,191,.2), transparent 70%); }
  .balance-card .lbl{font-size:11px; color:var(--text-dim); letter-spacing:2px;}
  .balance-card .amt{font-size:38px; font-weight:900; margin:8px 0; color:var(--accent);}
  .balance-card .amt span{font-size:16px; color:var(--text-dim); font-weight:700;}
  .actions-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:14px;}
  .actions-row .btn{flex-direction:column; padding:12px 4px; font-size:11px; gap:5px;}
  .actions-row .btn i{font-size:16px;}
  .tx-row{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-top:1px solid var(--border);}
  .tx-row:first-child{border-top:none;}
  .tx-amt.pos{color:var(--success); font-weight:800;}
  .tx-amt.neg{color:var(--danger); font-weight:800;}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="topbar">
    <a href="index.html" class="brand" style="text-decoration:none;">
      <div class="logo-frame sm"><img src="assets/logo.png" alt="logo"></div>
      <div><div class="name">بنك النقابة</div><div class="sub">EMERALD BANK</div></div>
    </a>
    <div id="topRightSlot"></div>
  </div>

  <div id="content"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/db.js?v=6"></script>
<script src="js/main.js?v=5"></script>
<script>
const state = { view:"gate", session: Session.get() && ["member","bankAdmin"].includes(Session.get().role) ? Session.get() : null };

function render(){
  const c = document.getElementById("content");
  const top = document.getElementById("topRightSlot");
  window.HELP_CTX = !state.session ? "home" : (state.session.role==="member" ? "member" : "bankAdmin");
  if(!state.session){
    top.innerHTML="";
    c.innerHTML = gateHTML();
    bindGate();
    return;
  }
  if(state.session.role==="member"){
    top.innerHTML = `<button class="btn btn-ghost btn-sm" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>`;
    c.innerHTML = `<div class="skeleton" style="height:200px;border-radius:16px;margin:16px;"></div>`;
    renderMemberDashboard();
  } else {
    top.innerHTML = `<button class="btn btn-ghost btn-sm" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>`;
    c.innerHTML = `<div class="skeleton" style="height:200px;border-radius:16px;margin:16px;"></div>`;
    renderAdminDashboard();
  }
}

/* ================= GATE (login chooser) ================= */
function gateHTML(){
  return `
  <div style="padding:16px;">
    <div class="seg" id="gateSeg">
      <button class="active" data-t="member">دخول عضو</button>
      <button data-t="admin">دخول مسؤول البنك</button>
    </div>

    <div id="memberForm">
      <div class="card">
        <div class="card-title"><i class="fa-solid fa-user"></i> تسجيل دخول العضو</div>
        <div class="field"><label><i class="fa-solid fa-hashtag"></i> الآيدي الشخصي</label><input id="mId" placeholder="مثال: 1000001"></div>
        <div class="field"><label><i class="fa-solid fa-tag"></i> اللقب</label><input id="mTitle" placeholder="لقبك في النقابة"></div>
        <div class="field"><label><i class="fa-solid fa-lock"></i> كلمة المرور</label>
          <div class="pw-wrap"><input type="password" id="mPass" placeholder="كلمة المرور"><i class="fa-solid fa-eye" onclick="togglePw('mPass',this)"></i></div>
        </div>
        <button class="btn btn-primary btn-block" onclick="memberLogin()"><i class="fa-solid fa-right-to-bracket"></i> دخول</button>
      </div>
    </div>

    <div id="adminForm" class="hidden">
      <div class="card">
        <div class="card-title"><i class="fa-solid fa-user-shield"></i> دخول مسؤول البنك</div>
        <div class="field"><label><i class="fa-solid fa-lock"></i> كلمة مرور المسؤول</label>
          <div class="pw-wrap"><input type="password" id="aPass" placeholder="كلمة المرور"><i class="fa-solid fa-eye" onclick="togglePw('aPass',this)"></i></div>
        </div>
        <button class="btn btn-primary btn-block" onclick="adminLogin()"><i class="fa-solid fa-right-to-bracket"></i> دخول لوحة الإدارة</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><i class="fa-solid fa-circle-question"></i> استفسارات</div>
      <div class="muted center" id="bankAdminInfo" style="padding:8px 0;">...</div>
    </div>
  </div>`;
}
function bindGate(){
  document.querySelectorAll("#gateSeg button").forEach(b=>{
    b.onclick = ()=>{
      document.querySelectorAll("#gateSeg button").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      document.getElementById("memberForm").classList.toggle("hidden", b.dataset.t!=="member");
      document.getElementById("adminForm").classList.toggle("hidden", b.dataset.t!=="admin");
    };
  });
  DB.getAdmins().then(a=>{
    document.getElementById("bankAdminInfo").innerHTML = (a.bank.avatar? `<img src="${a.bank.avatar}" alt="" class="avatar" style="width:64px;height:64px;display:block;margin:0 auto 8px;">`:"") + `مسؤول البنك: <b>${esc(a.bank.name)}</b>` + (a.bank.whatsapp? ` — <a class="btn btn-outline btn-sm" style="display:inline-flex;margin-top:8px;" href="${waLink(a.bank.whatsapp,'مرحبًا، لدي استفسار بخصوص حسابي في البنك')}" target="_blank"><i class="fa-brands fa-whatsapp"></i> تواصل واتساب</a>`:"");
  });
}
async function memberLogin(){
  const id = document.getElementById("mId").value.trim();
  const title = document.getElementById("mTitle").value.trim();
  const pass = document.getElementById("mPass").value;
  if(!id||!title||!pass){ toast("عبّي كل الحقول","error"); return; }
  const m = await DB.verifyMember(id,title,pass);
  if(!m){ toast("بيانات الدخول غير صحيحة","error"); return; }
  if(m.status==="frozen"){ toast("حسابك مجمّد، تواصل مع مسؤول البنك","error"); return; }
  Session.set("member",{id:m.id});
  state.session = Session.get();
  toast("مرحبًا بعودتك، "+m.title,"success");
  render();
}
async function adminLogin(){
  const pass = document.getElementById("aPass").value;
  const ok = await DB.verifyBankAdmin(pass);
  if(!ok){ toast("كلمة مرور خاطئة","error"); return; }
  Session.set("bankAdmin",{});
  state.session = Session.get();
  toast("مرحبًا بك يا مسؤول البنك","success");
  render();
}
function logout(){ Session.clear(); state.session=null; render(); }

/* ================= MEMBER DASHBOARD ================= */
let reqFilter="all", lbIdx=0, MD={txs:[],mine:[],lb:null,pw:""};
const TXL={purchase:"شراء من المتجر",transfer_in:"تحويل مستلم",transfer_out:"تحويل صادر",admin_add:"إضافة إدارية",admin_deduct:"خصم إداري"};
const LBC=[{k:"rich",t:"الأغنى",u:"EMD",i:"fa-coins"},{k:"transfers",t:"الأكثر تحويلاً",u:"تحويل",i:"fa-arrow-right-arrow-left"},{k:"spend",t:"الأكثر إنفاقًا",u:"EMD",i:"fa-bag-shopping"}];
function fmtDT(iso){ return new Date(iso).toLocaleString("ar-SA-u-ca-gregory",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); }
function stBadge(s){ return statusBadge(s); }

async function renderMemberDashboard(){
  const m = await DB.getMember(state.session.id);
  if(!m){ logout(); return; }
  const [txs, trq, ords, lb] = await Promise.all([DB.getTransactions(m.id), DB.getRequests(), DB.getOrders(), DB.getLeaderboard()]);
  const mine = [
    ...trq.filter(r=>r.memberId===m.id).map(r=>({kind:"تحويل", title:"تحويل إلى #"+r.toMemberId, amount:r.amount, status:r.status, createdAt:r.createdAt, note:r.note||""})),
    ...ords.filter(o=>o.memberId===m.id).map(o=>({kind:"شراء", title:o.productName+" × "+o.qty, amount:o.totalEMD, status:o.status, createdAt:o.createdAt, note:""})),
  ].sort((x,y)=>String(y.createdAt).localeCompare(String(x.createdAt)));
  MD = {txs, mine, lb, pw:m.password};
  const ops = txs.filter(t=>t.type!=="purchase"), buys = txs.filter(t=>t.type==="purchase");
  document.getElementById("content").innerHTML = `
  <div style="padding:16px;">
    <div class="card glow">
      <div class="card-title" style="justify-content:center;"><i class="fa-solid fa-id-card"></i> معلومات العضو</div>
      ${m.avatar? `<img class="mv-pic" src="${esc(m.avatar)}" alt="">` : `<div class="logo-frame" style="margin:0 auto 14px;display:flex;"><img src="assets/logo.png"></div>`}
      <div class="info-grid">
        <div class="info-cell"><div class="k"><i class="fa-solid fa-tag"></i> اللقب</div><div class="v">${esc(m.title)}</div></div>
        <div class="info-cell"><div class="k"><i class="fa-solid fa-crown"></i> المنصب</div><div class="v">${esc(m.rank)}</div></div>
        <div class="info-cell"><div class="k"><i class="fa-solid fa-hashtag"></i> ID</div><div class="v" style="direction:ltr;">${esc(m.id)}</div></div>
        <div class="info-cell"><div class="k"><i class="fa-solid fa-key"></i> كلمة المرور</div><div class="v"><span id="pwv">••••••••</span><i class="fa-solid fa-eye" id="pwEye" onclick="toggleMemPw()"></i></div></div>
      </div>
      <div class="bal-card"><i class="fa-solid fa-coins"></i> الرصيد: <span class="count-up" id="balNum">0</span> EMD</div>
      <div class="hint center" style="margin:-4px 0 12px;">حالة الحساب: <b style="color:${m.status==='active'?'var(--success)':'var(--danger)'}">${m.status==='active'?'نشط':'مجمّد'}</b></div>
      <button class="btn btn-primary btn-block" onclick="openReqModal('transfer')"><i class="fa-solid fa-paper-plane"></i> تحويل رصيد</button>
      <button class="btn btn-ghost btn-block mt8" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> تسجيل خروج</button>
    </div>

    <div class="card">
      <div class="card-title" style="justify-content:center;"><i class="fa-solid fa-clock-rotate-left"></i> سجل العمليات</div>
      <div class="sub-row"><div class="st"><i class="fa-solid fa-list"></i> آخر العمليات</div><button class="btn btn-outline btn-xs" onclick="openFull('ops')">عرض السجل الكامل <i class="fa-solid fa-arrow-left"></i></button></div>
      ${ops.length? ops.slice(0,5).map(opRow).join("") : `<div class="empty-state" style="padding:20px;">لا توجد عمليات بعد</div>`}
    </div>

    <div class="card">
      <div class="card-title" style="justify-content:center;"><i class="fa-solid fa-cart-shopping"></i> سجل شراء المتجر</div>
      <div class="sub-row"><div class="st"><i class="fa-solid fa-list"></i> مشترياتك من المتجر</div><button class="btn btn-outline btn-xs" onclick="openFull('buy')">عرض السجل الكامل <i class="fa-solid fa-arrow-left"></i></button></div>
      ${buys.length? buys.slice(0,5).map(opRow).join("") : `<div class="empty-state" style="padding:20px;">لا توجد مشتريات حتى الآن</div>`}
    </div>

    <div class="card" id="myReqs">
      <div class="card-title" style="justify-content:center;"><i class="fa-solid fa-clipboard-list"></i> طلباتي</div>
      <div class="sub-row"><div class="st"><i class="fa-solid fa-filter"></i> حالة طلباتك</div></div>
      <div class="chips" id="reqChips">
        ${[["all","الكل"],["pending","قيد المراجعة"],["approved","مقبولة"],["rejected","مرفوضة"]].map(([k,t])=>`<div class="chip ${k===reqFilter?'active':''}" onclick="setReqFilter('${k}')">${t}</div>`).join("")}
      </div>
      <div id="reqList"></div>
    </div>

    <div class="card">
      <div class="card-title" style="justify-content:center;"><i class="fa-solid fa-trophy"></i> لوحة المتصدرين</div>
      <div class="lb-nav">
        <button class="iconbtn" onclick="lbGo(-1)"><i class="fa-solid fa-chevron-right"></i></button>
        <div class="lb-title" id="lbTitle"></div>
        <button class="iconbtn" onclick="lbGo(1)"><i class="fa-solid fa-chevron-left"></i></button>
      </div>
      <div id="lbList"></div>
    </div>
  </div>`;
  countUp(document.getElementById("balNum"), m.balance);
  paintReqs(); paintLB();
}
function toggleMemPw(){
  const v=document.getElementById("pwv"), e=document.getElementById("pwEye"), hidden = v.textContent.startsWith("•");
  v.textContent = hidden ? MD.pw : "••••••••";
  e.classList.toggle("fa-eye", !hidden); e.classList.toggle("fa-eye-slash", hidden);
}
function opRow(t){
  const pos = t.amount>=0;
  return `<div class="op-row">
    <div class="l"><span class="badge badge-teal">${TXL[t.type]||"عملية"}</span><span class="d">${fmtDT(t.createdAt)}</span></div>
    <div class="r"><span class="amt ${pos?'pos':'neg'}" style="direction:ltr;">${pos?'+':''}${fmtMoney(t.amount)}</span>
      <button class="btn btn-primary btn-xs" onclick="txDetails('${t.id}')">تفاصيل</button></div></div>`;
}
function modalBox(title, icon, inner){
  const w=document.createElement("div"); w.className="modal-bg show";
  w.innerHTML=`<div class="modal"><div class="modal-head"><h3><i class="fa-solid ${icon}"></i> ${title}</h3>
    <button class="modal-close" onclick="this.closest('.modal-bg').remove()"><i class="fa-solid fa-xmark"></i></button></div>${inner}</div>`;
  document.body.appendChild(w); Sound.open(); return w;
}
function txDetails(id){
  const t = MD.txs.find(x=>x.id===id); if(!t) return;
  const row=(k,v)=>`<div class="tx-row"><span class="muted">${k}</span><b style="font-size:13px;text-align:left;">${v}</b></div>`;
  modalBox("تفاصيل العملية","fa-receipt",
    row("نوع العملية",TXL[t.type]||"عملية")+row("المبلغ",`<span style="direction:ltr;display:inline-block;color:${t.amount>=0?'var(--success)':'var(--danger)'}">${t.amount>=0?'+':''}${fmtMoney(t.amount)} EMD</span>`)+
    row("التاريخ",fmtDT(t.createdAt))+row("الحالة",t.status==="done"?"مكتملة":esc(t.status))+(t.note?row("ملاحظة",esc(t.note)):"")+row("رقم العملية",`<span style="direction:ltr;display:inline-block;font-size:11px;">${esc(t.id)}</span>`));
}
function openFull(kind){
  const list = MD.txs.filter(t=> kind==="buy" ? t.type==="purchase" : t.type!=="purchase");
  modalBox(kind==="buy"?"سجل شراء المتجر الكامل":"سجل العمليات الكامل", kind==="buy"?"fa-cart-shopping":"fa-clock-rotate-left",
    list.length? list.map(opRow).join("") : `<div class="empty-state" style="padding:20px;">لا يوجد شيء بعد</div>`);
}
function setReqFilter(f){
  reqFilter=f;
  document.querySelectorAll("#reqChips .chip").forEach((c,i)=>c.classList.toggle("active", ["all","pending","approved","rejected"][i]===f));
  paintReqs();
}
function paintReqs(){
  const list = MD.mine.filter(r=> reqFilter==="all" || r.status===reqFilter);
  document.getElementById("reqList").innerHTML = list.length? list.map(r=>`
    <div class="req-item">
      <div class="top"><span class="badge badge-teal">${r.kind}</span>${stBadge(r.status)}</div>
      <div style="font-weight:800;font-size:13px;">${esc(r.title)}</div>
      <div class="muted" style="font-size:11px;margin-top:2px;">${fmtMoney(r.amount)} EMD · ${fmtDT(r.createdAt)}${r.note?' · '+esc(r.note):''}</div>
    </div>`).join("") : `<div class="empty-state" style="padding:20px;">لا توجد طلبات بهذا الفلتر</div>`;
}
function lbGo(d){ lbIdx=(lbIdx+d+LBC.length)%LBC.length; paintLB(); }
function paintLB(){
  const c=LBC[lbIdx], rows=(MD.lb&&MD.lb[c.k])||[];
  document.getElementById("lbTitle").innerHTML=`<i class="fa-solid ${c.i}"></i> ${c.t} <span class="muted">${lbIdx+1}/${LBC.length}</span>`;
  document.getElementById("lbList").innerHTML = rows.length? rows.map((r,i)=>`
    <div class="lb-row"><div class="rk">${i+1}</div><img class="avatar" style="width:32px;height:32px;" src="${esc(r.avatar||'assets/logo.png')}">
      <div class="nm">${esc(r.title)}</div><div class="vl">${fmtMoney(r.value)} ${c.u}</div></div>`).join("") : `<div class="empty-state" style="padding:20px;">لا توجد بيانات بعد</div>`;
}
function openReqModal(type){
  const map = {transfer:{title:"تحويل رصيد", icon:"fa-paper-plane"}};
  type = "transfer";
  let wrap = document.getElementById("reqModal");
  if(wrap) wrap.remove();
  wrap = document.createElement("div"); wrap.className="modal-bg show"; wrap.id="reqModal";
  wrap.innerHTML = `<div class="modal">
    <div class="modal-head"><h3><i class="fa-solid ${map[type].icon}"></i> ${map[type].title}</h3><button class="modal-close" onclick="document.getElementById('reqModal').remove()"><i class="fa-solid fa-xmark"></i></button></div>
    ${type==='transfer'?`<div class="field"><label>آيدي العضو المستلم</label><input id="reqTarget" placeholder="ID#"></div>`:""}
    <div class="field"><label>المبلغ (EMD)</label><input id="reqAmount" type="number" placeholder="0"></div>
    <div class="field"><label>ملاحظة (اختياري)</label><input id="reqNote" placeholder="سبب العملية"></div>
    <button class="btn btn-primary btn-block" onclick="submitRequest('${type}')"><i class="fa-solid fa-paper-plane"></i> إرسال الطلب لمسؤول البنك</button>
    <div class="hint center mt12">الطلب يحتاج موافقة مسؤول البنك قبل التنفيذ</div>
  </div>`;
  document.body.appendChild(wrap); Sound.open();
}
async function submitRequest(type){
  const amount = Number(document.getElementById("reqAmount").value);
  const note = document.getElementById("reqNote").value.trim();
  if(!amount || amount<=0){ toast("أدخل مبلغًا صحيحًا","error"); return; }
  const payload = { memberId: state.session.id, type, amount, note };
  if(type==="transfer"){
    const target = document.getElementById("reqTarget").value.trim();
    if(!target){ toast("أدخل آيدي المستلم","error"); return; }
    const t = await DB.getMember(target);
    if(!t){ toast("العضو المستلم غير موجود","error"); return; }
    payload.toMemberId = target;
  }
  await DB.addRequest(payload);
  document.getElementById("reqModal").remove();
  toast("تم إرسال طلبك، وحالته الآن: قيد المراجعة","success");
  reqFilter="all";
  await renderMemberDashboard();
  const el=document.getElementById("myReqs"); if(el) el.scrollIntoView({behavior:"smooth"});
}

/* ================= BANK ADMIN DASHBOARD ================= */
let adminTab = "requests";
async function renderAdminDashboard(){
  const c = document.getElementById("content");
  c.innerHTML = `
  <div style="padding:16px;">
    <div class="tabs" id="adminTabs">
      <div class="tab" data-t="regs">طلبات التسجيل</div>
      <div class="tab" data-t="requests">طلبات الأعضاء</div>
      <div class="tab" data-t="orders">طلبات المتجر</div>
      <div class="tab" data-t="members">الأعضاء</div>
      <div class="tab" data-t="log">السجل</div>
    </div>
    <div id="tabBody"></div>
  </div>`;
  document.querySelectorAll("#adminTabs .tab").forEach(t=>{
    t.onclick=()=>{ adminTab=t.dataset.t; paintTabs(); renderTabBody(); };
  });
  paintTabs(); renderTabBody();
}
function paintTabs(){ document.querySelectorAll("#adminTabs .tab").forEach(t=>t.classList.toggle("active", t.dataset.t===adminTab)); }

async function renderTabBody(){
  const body = document.getElementById("tabBody");
  body.innerHTML = `<div class="center" style="padding:30px;"><span class="spinner"></span></div>`;

  if(adminTab==="regs"){
    const regs = await DB.getRegistrations("pending");
    body.innerHTML = regs.length? regs.map(regCard).join("") : emptyBox("لا توجد طلبات تسجيل معلّقة");
    return;
  }
  if(adminTab==="requests"){
    const reqs = await DB.getRequests("pending");
    body.innerHTML = reqs.length? reqs.map(reqCard).join("") : emptyBox("لا توجد طلبات معلّقة");
    return;
  }
  if(adminTab==="orders"){
    const orders = await DB.getOrders("pending");
    body.innerHTML = orders.length? orders.map(orderCard).join("") : emptyBox("لا توجد طلبات شراء معلّقة");
    return;
  }
  if(adminTab==="members"){
    const members = await DB.getMembers();
    body.innerHTML = `
      <button class="btn btn-primary btn-block mt8" onclick="openAddMember()"><i class="fa-solid fa-user-plus"></i> إضافة عضو جديد</button>
      <div class="field mt16"><input placeholder="بحث بالاسم أو الآيدي..." oninput="filterMembers(this.value)" id="memberSearch"></div>
      <div id="membersList">${members.map(memberRow).join("")}</div>`;
    return;
  }
  if(adminTab==="log"){
    const log = await DB.getLog();
    body.innerHTML = log.length? `<div class="card">${log.slice(0,40).map(l=>`
      <div class="tx-row"><div><div style="font-weight:700;font-size:12.5px;">${l.action}</div><div class="muted" style="font-size:10.5px;">${l.detail}</div></div><div class="muted" style="font-size:10px;">${fmtDate(l.createdAt)}</div></div>`).join("")}</div>` : emptyBox("لا يوجد سجل بعد");
  }
}
function regCard(r){
  return `<div class="card">
    <div class="flex-between"><span class="badge badge-gold"><i class="fa-solid fa-user-plus"></i> طلب تسجيل</span><span class="muted" style="font-size:10px;">${fmtDT(r.createdAt)}</span></div>
    <div class="flex gap12" style="margin:12px 0;">
      <img class="avatar" style="width:56px;height:56px;" src="${esc(r.avatar||'assets/logo.png')}">
      <div><div style="font-weight:800;font-size:15px;">${esc(r.title)}</div>
        <div class="muted" style="font-size:12px;">الرتبة المذكورة: <b style="color:var(--accent)">${esc(r.rank)}</b></div>
        <div class="muted" style="font-size:12px;direction:ltr;text-align:right;">ID: ${esc(r.memberId)}</div></div>
    </div>
    <div class="hint" style="margin-bottom:10px;">تأكد أن الرتبة حقيقية، وارفض من يدّعي نائب أو مستشار أو رتبة غير صحيحة.</div>
    <div class="flex gap10">
      <button class="btn btn-danger btn-block btn-sm" onclick="rejectReg('${r.id}')"><i class="fa-solid fa-xmark"></i> رفض</button>
      <button class="btn btn-primary btn-block btn-sm" onclick="approveReg('${r.id}')"><i class="fa-solid fa-check"></i> قبول وإنشاء الحساب</button>
    </div></div>`;
}
async function approveReg(id){
  try{
    const res = await DB.decideRegistration(id,true,"مسؤول البنك");
    if(res.ok===false){ toast(res.msg,"error"); } else { Sound.coin(); toast("تم قبول العضو وإنشاء حسابه","success"); }
  }catch(e){ toast(e.message,"error"); }
  renderTabBody();
}
function rejectReg(id){
  const w = modalBox("سبب الرفض","fa-user-xmark",`<div class="field"><label>السبب (يظهر للعضو)</label><input id="rjReason" placeholder="مثال: رتبة غير صحيحة"></div>
    <button class="btn btn-danger btn-block" id="rjOk"><i class="fa-solid fa-xmark"></i> تأكيد الرفض</button>`);
  document.getElementById("rjOk").onclick = async ()=>{
    const reason = document.getElementById("rjReason").value.trim();
    try{ await DB.decideRegistration(id,false,"مسؤول البنك",reason||"رتبة غير صحيحة"); w.remove(); toast("تم رفض الطلب","info"); }
    catch(e){ toast(e.message,"error"); }
    renderTabBody();
  };
}
function emptyBox(msg){ return `<div class="empty-state"><i class="fa-solid fa-inbox"></i>${msg}</div>`; }

function reqCard(r){
  const map={transfer:"تحويل بين الأعضاء"};
  return `<div class="card">
    <div class="flex-between"><span class="badge badge-teal">${map[r.type]}</span><span class="muted" style="font-size:10px;">${fmtDate(r.createdAt)}</span></div>
    <div style="margin:10px 0;">
      <div style="font-weight:800;font-size:16px;">${fmtMoney(r.amount)} EMD</div>
      <div class="muted" style="font-size:12px;">من العضو #${esc(r.memberId)}${r.toMemberId? ' → إلى #'+esc(r.toMemberId):''} ${r.note?'· '+esc(r.note):''}</div>
    </div>
    <div class="flex gap10">
      <button class="btn btn-danger btn-block btn-sm" onclick="decideReq('${r.id}',false)"><i class="fa-solid fa-xmark"></i> رفض</button>
      <button class="btn btn-primary btn-block btn-sm" onclick="decideReq('${r.id}',true)"><i class="fa-solid fa-check"></i> موافقة وتنفيذ</button>
    </div>
  </div>`;
}
async function decideReq(id, approve){
  const res = await DB.decideRequest(id, approve, "مسؤول البنك");
  if(res && res.ok===false){ toast(res.msg,"error"); }
  else toast(approve? "تم الاعتماد والتنفيذ":"تم رفض الطلب", approve?"success":"info");
  renderTabBody();
}

function orderCard(o){
  return `<div class="card">
    <div class="flex-between"><span class="badge badge-gold"><i class="fa-solid fa-bag-shopping"></i> طلب شراء</span><span class="muted" style="font-size:10px;">${fmtDate(o.createdAt)}</span></div>
    <div style="margin:10px 0;">
      <div style="font-weight:800;font-size:15px;">${esc(o.productName)} × ${esc(o.qty)}</div>
      <div class="muted" style="font-size:12px;">عضو #${o.memberId} · الإجمالي <b style="color:var(--accent)">${fmtMoney(o.totalEMD)} EMD</b></div>
    </div>
    <div class="flex gap10">
      <button class="btn btn-danger btn-block btn-sm" onclick="decideOrd('${o.id}',false)"><i class="fa-solid fa-xmark"></i> رفض</button>
      <button class="btn btn-primary btn-block btn-sm" onclick="decideOrd('${o.id}',true)"><i class="fa-solid fa-check"></i> قبول وخصم المبلغ</button>
    </div>
  </div>`;
}
async function decideOrd(id, approve){
  const order = (await DB.getOrders()).find(o=>o.id===id);
  const res = await DB.decideOrder(id, approve, "مسؤول البنك");
  if(res && res.ok===false){ toast(res.msg,"error"); renderTabBody(); return; }
  Sound.coin();
  toast(approve? "تم قبول الطلب وخصم المبلغ تلقائيًا":"تم رفض الطلب", approve?"success":"info");
  if(approve && order){
    const member = await DB.getMember(order.memberId);
    if(member && member.whatsapp){
      window.open(waLink(member.whatsapp, `تم قبول طلب شرائك: ${order.productName} × ${order.qty}\nالمبلغ المخصوم: ${order.totalEMD} EMD\nشكرًا لتعاملك مع نقابة إميرالد.`), "_blank");
    }
  }
  renderTabBody();
}

function memberRow(m){
  return `<div class="mrow" data-name="${esc(m.title)} ${esc(m.id)}">
    <div class="info">
      <img class="avatar" src="${esc(m.avatar||'assets/logo.png')}">
      <div>
        <div class="name">${esc(m.title)} <span class="muted">#${esc(m.id)}</span></div>
        <div class="sub">${esc(m.rank)} · <b style="color:var(--accent)">${fmtMoney(m.balance)} EMD</b> ${m.status==='frozen'?'<span class="badge badge-red">مجمد</span>':''}</div>
      </div>
    </div>
    <div class="actions">
      <button class="iconbtn" title="تغيير الصورة" onclick="openMemberPhoto('${m.id}')"><i class="fa-solid fa-camera"></i></button>
      <button class="iconbtn" title="تعديل الرصيد" onclick="openAdjustBalance('${m.id}')"><i class="fa-solid fa-coins"></i></button>
      <button class="iconbtn" title="${m.status==='frozen'?'تفعيل':'تجميد'}" onclick="toggleFreeze('${m.id}','${m.status}')"><i class="fa-solid ${m.status==='frozen'?'fa-lock-open':'fa-lock'}"></i></button>
      ${m.whatsapp? `<a class="iconbtn" href="${waLink(m.whatsapp,'مرحبًا '+m.title)}" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>`:""}
      <button class="iconbtn" title="تعديل البيانات" onclick="openEditMember('${m.id}')"><i class="fa-solid fa-pen"></i></button>
      <button class="iconbtn danger" title="حذف العضو" onclick="deleteMemberBank('${m.id}')"><i class="fa-solid fa-trash"></i></button>
    </div>
  </div>`;
}
async function openEditMember(id){
  const m = await DB.getMember(id); if(!m) return;
  let wrap=document.getElementById("editMemberModal"); if(wrap) wrap.remove();
  wrap=document.createElement("div"); wrap.className="modal-bg show"; wrap.id="editMemberModal";
  wrap.innerHTML=`<div class="modal">
    <div class="modal-head"><h3><i class="fa-solid fa-pen"></i> تعديل بيانات العضو</h3><button class="modal-close" onclick="document.getElementById('editMemberModal').remove()"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="field"><label>اللقب</label><input id="emTitle" value="${esc(m.title)}"></div>
    <div class="field"><label>الرتبة/المنصب</label><input id="emRank" value="${esc(m.rank)}"></div>
    <div class="field"><label>كلمة المرور</label><input id="emPass" value="${esc(m.password)}"></div>
    <div class="field"><label>واتساب</label><input id="emWa" value="${esc(m.whatsapp||'')}"></div>
    ${avatarPickerHTML("emAvatar", m.avatar)}
    <button class="btn btn-primary btn-block" onclick="submitEditMember('${id}')"><i class="fa-solid fa-check"></i> حفظ التعديلات</button>
  </div>`;
  document.body.appendChild(wrap); Sound.open();
}
async function submitEditMember(id){
  const title=document.getElementById("emTitle").value.trim();
  const pass=document.getElementById("emPass").value;
  if(!title||!pass){ toast("اللقب وكلمة المرور مطلوبان","error"); return; }
  try{
    const all = await DB.getMembers();
    if(all.some(x=>x.id!==id && (x.title||"").trim().toLowerCase()===title.toLowerCase())){ toast("اللقب مستخدم مسبقًا","error"); return; }
    await DB.updateMember(id,{ title, rank:document.getElementById("emRank").value.trim()||"عضو", password:pass, whatsapp:document.getElementById("emWa").value.trim(), avatar:getAvatar("emAvatar") });
    document.getElementById("editMemberModal").remove(); toast("تم حفظ التعديلات","success"); renderTabBody();
  }catch(e){ toast(e.message,"error"); }
}
function deleteMemberBank(id){
  confirmAction("سيتم حذف هذا العضو نهائيًا من قاعدة البيانات. متأكد؟", async ()=>{
    try{ await DB.deleteMember(id); toast("تم حذف العضو","info"); renderTabBody(); }
    catch(e){ toast(e.message,"error"); }
  });
}
function filterMembers(q){
  q = q.trim();
  document.querySelectorAll("#membersList .mrow").forEach(r=>{
    r.style.display = r.dataset.name.includes(q) ? "flex" : "none";
  });
}
function openAddMember(){
  let wrap = document.getElementById("addMemberModal");
  if(wrap) wrap.remove();
  wrap = document.createElement("div"); wrap.className="modal-bg show"; wrap.id="addMemberModal";
  wrap.innerHTML = `<div class="modal">
    <div class="modal-head"><h3><i class="fa-solid fa-user-plus"></i> إضافة عضو جديد</h3><button class="modal-close" onclick="document.getElementById('addMemberModal').remove()"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="field"><label>لقب العضو</label><input id="nmTitle" placeholder="اللقب داخل النقابة"></div>
    <div class="field"><label>المنصب / الرتبة</label><input id="nmRank" placeholder="مثال: فارس الزمرد"></div>
    <div class="field"><label>الآيدي (أرقام)</label><input id="nmId" placeholder="1000002"></div>
    <div class="field"><label>الرصيد الابتدائي</label><input id="nmBalance" type="number" value="0"></div>
    <div class="field"><label>كلمة المرور</label><input id="nmPass" placeholder="كلمة مرور العضو"></div>
    <div class="field"><label>رقم الواتساب</label><input id="nmWa" placeholder="9665xxxxxxxx"></div>
    ${avatarPickerHTML("nmAvatar","")}
    <button class="btn btn-primary btn-block" onclick="submitAddMember()"><i class="fa-solid fa-circle-plus"></i> إضافة العضو</button>
  </div>`;
  document.body.appendChild(wrap); Sound.open();
}
async function submitAddMember(){
  const title=document.getElementById("nmTitle").value.trim();
  const rank=document.getElementById("nmRank").value.trim()||"عضو";
  const id=document.getElementById("nmId").value.trim();
  const balance=Number(document.getElementById("nmBalance").value)||0;
  const pass=document.getElementById("nmPass").value;
  const wa=document.getElementById("nmWa").value.trim();
  if(!title||!id||!pass){ toast("عبّي الحقول الأساسية","error"); return; }
  try{
    await DB.addMember({id,title,rank,balance,password:pass,whatsapp:wa,avatar:getAvatar("nmAvatar")});
    document.getElementById("addMemberModal").remove();
    toast("تمت إضافة العضو بنجاح","success");
    renderTabBody();
  }catch(e){ toast(e.message,"error"); }
}
async function openMemberPhoto(id){
  const m = await DB.getMember(id); if(!m) return;
  let wrap = document.getElementById("photoModal"); if(wrap) wrap.remove();
  wrap = document.createElement("div"); wrap.className="modal-bg show"; wrap.id="photoModal";
  wrap.innerHTML = `<div class="modal">
    <div class="modal-head"><h3><i class="fa-solid fa-camera"></i> صورة ${esc(m.title)}</h3><button class="modal-close" onclick="document.getElementById('photoModal').remove()"><i class="fa-solid fa-xmark"></i></button></div>
    ${avatarPickerHTML("mpAvatar", m.avatar)}
    <button class="btn btn-primary btn-block" onclick="saveMemberPhoto('${id}')"><i class="fa-solid fa-check"></i> حفظ الصورة</button>
  </div>`;
  document.body.appendChild(wrap); Sound.open();
}
async function saveMemberPhoto(id){
  try{ await DB.updateMember(id,{avatar:getAvatar("mpAvatar")}); document.getElementById("photoModal").remove(); toast("تم حفظ الصورة","success"); renderTabBody(); }
  catch(e){ toast(e.message,"error"); }
}
function openAdjustBalance(id){
  let wrap = document.getElementById("adjModal"); if(wrap) wrap.remove();
  wrap=document.createElement("div"); wrap.className="modal-bg show"; wrap.id="adjModal";
  wrap.innerHTML=`<div class="modal">
    <div class="modal-head"><h3><i class="fa-solid fa-coins"></i> تعديل الرصيد</h3><button class="modal-close" onclick="document.getElementById('adjModal').remove()"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="field"><label>المبلغ (استخدم إشارة سالبة للخصم)</label><input id="adjAmt" type="number" placeholder="مثال: 500 أو -500-"></div>
    <div class="field"><label>ملاحظة</label><input id="adjNote" placeholder="سبب التعديل"></div>
    <button class="btn btn-primary btn-block" onclick="submitAdjust('${id}')"><i class="fa-solid fa-check"></i> تنفيذ</button>
  </div>`;
  document.body.appendChild(wrap); Sound.open();
}
async function submitAdjust(id){
  const amt = Number(document.getElementById("adjAmt").value);
  const note = document.getElementById("adjNote").value.trim();
  if(!amt){ toast("أدخل مبلغًا","error"); return; }
  await DB.adjustBalance(id, amt, amt>0?"admin_add":"admin_deduct", note, "مسؤول البنك");
  document.getElementById("adjModal").remove();
  toast("تم تحديث الرصيد","success");
  renderTabBody();
}
async function toggleFreeze(id, status){
  await DB.updateMember(id, {status: status==="frozen"?"active":"frozen"});
  toast(status==="frozen"?"تم تفعيل الحساب":"تم تجميد الحساب","info");
  renderTabBody();
}

mountFab({admin:"bank", leader:true});
render();
</script>
</body>
</html>

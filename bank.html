<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بنك النقابة | Emerald Bank</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
  .balance-card{ text-align:center; padding:26px 18px; position:relative; overflow:hidden; }
  .balance-card::before{ content:""; position:absolute; inset:0; background:radial-gradient(circle at 50% 0%, rgba(45,212,191,.15), transparent 70%); }
  .balance-card .lbl{font-size:11px; color:var(--text-dim); letter-spacing:2px;}
  .balance-card .amt{font-size:38px; font-weight:900; margin:8px 0; color:var(--accent);}
  .balance-card .amt span{font-size:16px; color:var(--text-dim); font-weight:700;}
  .actions-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:14px;}
  .actions-row .btn{flex-direction:column; padding:12px 4px; font-size:11px; gap:5px;}
  .actions-row .btn i{font-size:16px;}
  .tx-row{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-top:1px solid var(--border);}
  .tx-row:first-child{border-top:none;}
  .tx-amt.pos{color:var(--success); font-weight:800;}
  .tx-amt.neg{color:var(--danger); font-weight:800;}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="topbar">
    <a href="index.html" class="brand" style="text-decoration:none;">
      <img src="assets/logo.png" alt="logo">
      <div><div class="name">بنك النقابة</div><div class="sub">EMERALD BANK</div></div>
    </a>
    <div id="topRightSlot"></div>
  </div>

  <div id="content"></div>
</div>

<script src="js/db.js"></script>
<script src="js/main.js"></script>
<script>
const state = { view:"gate", session: Session.get() && ["member","bankAdmin"].includes(Session.get().role) ? Session.get() : null };

function render(){
  const c = document.getElementById("content");
  const top = document.getElementById("topRightSlot");
  if(!state.session){
    top.innerHTML="";
    c.innerHTML = gateHTML();
    bindGate();
    return;
  }
  if(state.session.role==="member"){
    top.innerHTML = `<button class="btn btn-ghost btn-sm" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>`;
    c.innerHTML = `<div class="skeleton" style="height:200px;border-radius:16px;margin:16px;"></div>`;
    renderMemberDashboard();
  } else {
    top.innerHTML = `<button class="btn btn-ghost btn-sm" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>`;
    c.innerHTML = `<div class="skeleton" style="height:200px;border-radius:16px;margin:16px;"></div>`;
    renderAdminDashboard();
  }
}

/* ================= GATE (login chooser) ================= */
function gateHTML(){
  return `
  <div style="padding:16px;">
    <div class="seg" id="gateSeg">
      <button class="active" data-t="member">دخول عضو</button>
      <button data-t="admin">دخول مسؤول البنك</button>
    </div>

    <div id="memberForm">
      <div class="card">
        <div class="card-title"><i class="fa-solid fa-user"></i> تسجيل دخول العضو</div>
        <div class="field"><label><i class="fa-solid fa-hashtag"></i> الآيدي الشخصي</label><input id="mId" placeholder="مثال: 1000001"></div>
        <div class="field"><label><i class="fa-solid fa-tag"></i> اللقب</label><input id="mTitle" placeholder="لقبك في النقابة"></div>
        <div class="field"><label><i class="fa-solid fa-lock"></i> كلمة المرور</label>
          <div class="pw-wrap"><input type="password" id="mPass" placeholder="كلمة المرور"><i class="fa-solid fa-eye" onclick="togglePw('mPass',this)"></i></div>
        </div>
        <button class="btn btn-primary btn-block" onclick="memberLogin()"><i class="fa-solid fa-right-to-bracket"></i> دخول</button>
      </div>
    </div>

    <div id="adminForm" class="hidden">
      <div class="card">
        <div class="card-title"><i class="fa-solid fa-user-shield"></i> دخول مسؤول البنك</div>
        <div class="field"><label><i class="fa-solid fa-lock"></i> كلمة مرور المسؤول</label>
          <div class="pw-wrap"><input type="password" id="aPass" placeholder="كلمة المرور"><i class="fa-solid fa-eye" onclick="togglePw('aPass',this)"></i></div>
        </div>
        <button class="btn btn-primary btn-block" onclick="adminLogin()"><i class="fa-solid fa-right-to-bracket"></i> دخول لوحة الإدارة</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><i class="fa-solid fa-circle-question"></i> استفسارات</div>
      <div class="muted center" id="bankAdminInfo" style="padding:8px 0;">...</div>
    </div>
  </div>`;
}
function bindGate(){
  document.querySelectorAll("#gateSeg button").forEach(b=>{
    b.onclick = ()=>{
      document.querySelectorAll("#gateSeg button").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      document.getElementById("memberForm").classList.toggle("hidden", b.dataset.t!=="member");
      document.getElementById("adminForm").classList.toggle("hidden", b.dataset.t!=="admin");
    };
  });
  DB.getAdmins().then(a=>{
    document.getElementById("bankAdminInfo").innerHTML = `مسؤول البنك: <b>${a.bank.name}</b>` + (a.bank.whatsapp? ` — <a class="btn btn-outline btn-sm" style="display:inline-flex;margin-top:8px;" href="${waLink(a.bank.whatsapp,'مرحبًا، لدي استفسار بخصوص حسابي في البنك')}" target="_blank"><i class="fa-brands fa-whatsapp"></i> تواصل واتساب</a>`:"");
  });
}
async function memberLogin(){
  const id = document.getElementById("mId").value.trim();
  const title = document.getElementById("mTitle").value.trim();
  const pass = document.getElementById("mPass").value;
  if(!id||!title||!pass){ toast("عبّي كل الحقول","error"); return; }
  const m = await DB.verifyMember(id,title,pass);
  if(!m){ toast("بيانات الدخول غير صحيحة","error"); return; }
  if(m.status==="frozen"){ toast("حسابك مجمّد، تواصل مع مسؤول البنك","error"); return; }
  Session.set("member",{id:m.id});
  state.session = Session.get();
  toast("مرحبًا بعودتك، "+m.title,"success");
  render();
}
async function adminLogin(){
  const pass = document.getElementById("aPass").value;
  const ok = await DB.verifyBankAdmin(pass);
  if(!ok){ toast("كلمة مرور خاطئة","error"); return; }
  Session.set("bankAdmin",{});
  state.session = Session.get();
  toast("مرحبًا بك يا مسؤول البنك","success");
  render();
}
function logout(){ Session.clear(); state.session=null; render(); }

/* ================= MEMBER DASHBOARD ================= */
async function renderMemberDashboard(){
  const m = await DB.getMember(state.session.id);
  if(!m){ logout(); return; }
  const txs = await DB.getTransactions(m.id);
  const c = document.getElementById("content");
  c.innerHTML = `
  <div style="padding:16px;">
    <div class="card glow balance-card">
      <img src="assets/logo.png" style="width:44px;margin-bottom:6px;filter:drop-shadow(0 0 12px var(--accent));">
      <div class="lbl">EMERALD VAULT BALANCE</div>
      <div class="amt"><span>EMD</span> <span class="count-up" id="balNum">0</span></div>
      <div class="muted">${m.title} <span style="opacity:.5">#${m.id}</span> · ${m.rank}</div>
      <div class="actions-row">
        <button class="btn btn-ghost" onclick="openReqModal('transfer')"><i class="fa-solid fa-paper-plane"></i>تحويل</button>
        <button class="btn btn-ghost" onclick="openReqModal('deposit')"><i class="fa-solid fa-arrow-down"></i>إيداع</button>
        <button class="btn btn-ghost" onclick="openReqModal('withdraw')"><i class="fa-solid fa-arrow-up"></i>سحب</button>
      </div>
    </div>

    <div class="grid-2">
      <div class="stat"><i class="fa-solid fa-receipt"></i><div class="val">${txs.length}</div><div class="lbl">إجمالي العمليات</div></div>
      <div class="stat"><i class="fa-solid fa-shield-halved"></i><div class="val" style="color:var(--success)">${m.status==='active'?'نشط':'مجمد'}</div><div class="lbl">حالة الحساب</div></div>
    </div>

    <div class="card">
      <div class="card-title"><i class="fa-solid fa-clock-rotate-left"></i> آخر العمليات المصرفية</div>
      <div id="txList">${txs.length? txs.slice(0,15).map(txRow).join(""): `<div class="empty-state"><i class="fa-solid fa-inbox"></i>لا توجد عمليات بعد</div>`}</div>
    </div>
  </div>`;
  countUp(document.getElementById("balNum"), m.balance);
}
function txRow(t){
  const pos = t.amount>=0;
  const map = {deposit:"إيداع",withdraw:"سحب",purchase:"شراء من المتجر",transfer_in:"تحويل مستلم",transfer_out:"تحويل صادر",admin_add:"إضافة إدارية",admin_deduct:"خصم إداري"};
  return `<div class="tx-row">
    <div><div style="font-weight:700;font-size:13px;">${map[t.type]||t.type}</div><div class="muted" style="font-size:10.5px;">${fmtDate(t.createdAt)} ${t.note?'· '+t.note:''}</div></div>
    <div class="tx-amt ${pos?'pos':'neg'}">${pos?'+':''}${fmtMoney(t.amount)}</div>
  </div>`;
}
function openReqModal(type){
  const map = {transfer:{title:"تحويل رصيد", icon:"fa-paper-plane"}, deposit:{title:"طلب إيداع", icon:"fa-arrow-down"}, withdraw:{title:"طلب سحب", icon:"fa-arrow-up"}};
  let wrap = document.getElementById("reqModal");
  if(wrap) wrap.remove();
  wrap = document.createElement("div"); wrap.className="modal-bg show"; wrap.id="reqModal";
  wrap.innerHTML = `<div class="modal">
    <div class="modal-head"><h3><i class="fa-solid ${map[type].icon}"></i> ${map[type].title}</h3><button class="modal-close" onclick="document.getElementById('reqModal').remove()"><i class="fa-solid fa-xmark"></i></button></div>
    ${type==='transfer'?`<div class="field"><label>آيدي العضو المستلم</label><input id="reqTarget" placeholder="ID#"></div>`:""}
    <div class="field"><label>المبلغ (EMD)</label><input id="reqAmount" type="number" placeholder="0"></div>
    <div class="field"><label>ملاحظة (اختياري)</label><input id="reqNote" placeholder="سبب العملية"></div>
    <button class="btn btn-primary btn-block" onclick="submitRequest('${type}')"><i class="fa-solid fa-paper-plane"></i> إرسال الطلب لمسؤول البنك</button>
    <div class="hint center mt12">الطلب يحتاج موافقة مسؤول البنك قبل التنفيذ</div>
  </div>`;
  document.body.appendChild(wrap); Sound.open();
}
async function submitRequest(type){
  const amount = Number(document.getElementById("reqAmount").value);
  const note = document.getElementById("reqNote").value.trim();
  if(!amount || amount<=0){ toast("أدخل مبلغًا صحيحًا","error"); return; }
  const payload = { memberId: state.session.id, type, amount, note };
  if(type==="transfer"){
    const target = document.getElementById("reqTarget").value.trim();
    if(!target){ toast("أدخل آيدي المستلم","error"); return; }
    const t = await DB.getMember(target);
    if(!t){ toast("العضو المستلم غير موجود","error"); return; }
    payload.toMemberId = target;
  }
  await DB.addRequest(payload);
  document.getElementById("reqModal").remove();
  toast("تم إرسال طلبك، بانتظار اعتماد مسؤول البنك","success");
  renderMemberDashboard();
}

/* ================= BANK ADMIN DASHBOARD ================= */
let adminTab = "requests";
async function renderAdminDashboard(){
  const c = document.getElementById("content");
  c.innerHTML = `
  <div style="padding:16px;">
    <div class="tabs" id="adminTabs">
      <div class="tab" data-t="requests">طلبات الأعضاء</div>
      <div class="tab" data-t="orders">طلبات المتجر</div>
      <div class="tab" data-t="members">الأعضاء</div>
      <div class="tab" data-t="log">السجل</div>
    </div>
    <div id="tabBody"></div>
  </div>`;
  document.querySelectorAll("#adminTabs .tab").forEach(t=>{
    t.onclick=()=>{ adminTab=t.dataset.t; paintTabs(); renderTabBody(); };
  });
  paintTabs(); renderTabBody();
}
function paintTabs(){ document.querySelectorAll("#adminTabs .tab").forEach(t=>t.classList.toggle("active", t.dataset.t===adminTab)); }

async function renderTabBody(){
  const body = document.getElementById("tabBody");
  body.innerHTML = `<div class="center" style="padding:30px;"><span class="spinner"></span></div>`;

  if(adminTab==="requests"){
    const reqs = await DB.getRequests("pending");
    body.innerHTML = reqs.length? reqs.map(reqCard).join("") : emptyBox("لا توجد طلبات معلّقة");
    return;
  }
  if(adminTab==="orders"){
    const orders = await DB.getOrders("pending");
    body.innerHTML = orders.length? orders.map(orderCard).join("") : emptyBox("لا توجد طلبات شراء معلّقة");
    return;
  }
  if(adminTab==="members"){
    const members = await DB.getMembers();
    body.innerHTML = `
      <button class="btn btn-primary btn-block mt8" onclick="openAddMember()"><i class="fa-solid fa-user-plus"></i> إضافة عضو جديد</button>
      <div class="field mt16"><input placeholder="بحث بالاسم أو الآيدي..." oninput="filterMembers(this.value)" id="memberSearch"></div>
      <div id="membersList">${members.map(memberRow).join("")}</div>`;
    return;
  }
  if(adminTab==="log"){
    const log = await DB.getLog();
    body.innerHTML = log.length? `<div class="card">${log.slice(0,40).map(l=>`
      <div class="tx-row"><div><div style="font-weight:700;font-size:12.5px;">${l.action}</div><div class="muted" style="font-size:10.5px;">${l.detail}</div></div><div class="muted" style="font-size:10px;">${fmtDate(l.createdAt)}</div></div>`).join("")}</div>` : emptyBox("لا يوجد سجل بعد");
  }
}
function emptyBox(msg){ return `<div class="empty-state"><i class="fa-solid fa-inbox"></i>${msg}</div>`; }

function reqCard(r){
  const map={deposit:"إيداع",withdraw:"سحب",transfer:"تحويل بين الأعضاء"};
  return `<div class="card">
    <div class="flex-between"><span class="badge badge-teal">${map[r.type]}</span><span class="muted" style="font-size:10px;">${fmtDate(r.createdAt)}</span></div>
    <div style="margin:10px 0;">
      <div style="font-weight:800;font-size:16px;">${fmtMoney(r.amount)} EMD</div>
      <div class="muted" style="font-size:12px;">من العضو #${r.memberId}${r.toMemberId? ' → إلى #'+r.toMemberId:''} ${r.note?'· '+r.note:''}</div>
    </div>
    <div class="flex gap10">
      <button class="btn btn-danger btn-block btn-sm" onclick="decideReq('${r.id}',false)"><i class="fa-solid fa-xmark"></i> رفض</button>
      <button class="btn btn-primary btn-block btn-sm" onclick="decideReq('${r.id}',true)"><i class="fa-solid fa-check"></i> موافقة وتنفيذ</button>
    </div>
  </div>`;
}
async function decideReq(id, approve){
  const res = await DB.decideRequest(id, approve, "مسؤول البنك");
  if(res && res.ok===false){ toast(res.msg,"error"); }
  else toast(approve? "تم الاعتماد والتنفيذ":"تم رفض الطلب", approve?"success":"info");
  renderTabBody();
}

function orderCard(o){
  return `<div class="card">
    <div class="flex-between"><span class="badge badge-gold"><i class="fa-solid fa-bag-shopping"></i> طلب شراء</span><span class="muted" style="font-size:10px;">${fmtDate(o.createdAt)}</span></div>
    <div style="margin:10px 0;">
      <div style="font-weight:800;font-size:15px;">${o.productName} × ${o.qty}</div>
      <div class="muted" style="font-size:12px;">عضو #${o.memberId} · الإجمالي <b style="color:var(--accent)">${fmtMoney(o.totalEMD)} EMD</b></div>
    </div>
    <div class="flex gap10">
      <button class="btn btn-danger btn-block btn-sm" onclick="decideOrd('${o.id}',false)"><i class="fa-solid fa-xmark"></i> رفض</button>
      <button class="btn btn-primary btn-block btn-sm" onclick="decideOrd('${o.id}',true)"><i class="fa-solid fa-check"></i> قبول وخصم المبلغ</button>
    </div>
  </div>`;
}
async function decideOrd(id, approve){
  const order = (await DB.getOrders()).find(o=>o.id===id);
  const res = await DB.decideOrder(id, approve, "مسؤول البنك");
  if(res && res.ok===false){ toast(res.msg,"error"); renderTabBody(); return; }
  Sound.coin();
  toast(approve? "تم قبول الطلب وخصم المبلغ تلقائيًا":"تم رفض الطلب", approve?"success":"info");
  if(approve && order){
    const member = await DB.getMember(order.memberId);
    if(member && member.whatsapp){
      window.open(waLink(member.whatsapp, `تم قبول طلب شرائك: ${order.productName} × ${order.qty}\nالمبلغ المخصوم: ${order.totalEMD} EMD\nشكرًا لتعاملك مع نقابة إميرالد.`), "_blank");
    }
  }
  renderTabBody();
}

function memberRow(m){
  return `<div class="mrow" data-name="${m.title} ${m.id}">
    <div class="info">
      <img class="avatar" src="${m.avatar||'assets/logo.png'}">
      <div>
        <div class="name">${m.title} <span class="muted">#${m.id}</span></div>
        <div class="sub">${m.rank} · <b style="color:var(--accent)">${fmtMoney(m.balance)} EMD</b> ${m.status==='frozen'?'<span class="badge badge-red">مجمد</span>':''}</div>
      </div>
    </div>
    <div class="actions">
      <button class="iconbtn" title="تعديل الرصيد" onclick="openAdjustBalance('${m.id}')"><i class="fa-solid fa-coins"></i></button>
      <button class="iconbtn" title="${m.status==='frozen'?'تفعيل':'تجميد'}" onclick="toggleFreeze('${m.id}','${m.status}')"><i class="fa-solid ${m.status==='frozen'?'fa-lock-open':'fa-lock'}"></i></button>
      ${m.whatsapp? `<a class="iconbtn" href="${waLink(m.whatsapp,'مرحبًا '+m.title)}" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>`:""}
    </div>
  </div>`;
}
function filterMembers(q){
  q = q.trim();
  document.querySelectorAll("#membersList .mrow").forEach(r=>{
    r.style.display = r.dataset.name.includes(q) ? "flex" : "none";
  });
}
function openAddMember(){
  let wrap = document.getElementById("addMemberModal");
  if(wrap) wrap.remove();
  wrap = document.createElement("div"); wrap.className="modal-bg show"; wrap.id="addMemberModal";
  wrap.innerHTML = `<div class="modal">
    <div class="modal-head"><h3><i class="fa-solid fa-user-plus"></i> إضافة عضو جديد</h3><button class="modal-close" onclick="document.getElementById('addMemberModal').remove()"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="field"><label>لقب العضو</label><input id="nmTitle" placeholder="اللقب داخل النقابة"></div>
    <div class="field"><label>المنصب / الرتبة</label><input id="nmRank" placeholder="مثال: فارس الزمرد"></div>
    <div class="field"><label>الآيدي (أرقام)</label><input id="nmId" placeholder="1000002"></div>
    <div class="field"><label>الرصيد الابتدائي</label><input id="nmBalance" type="number" value="0"></div>
    <div class="field"><label>كلمة المرور</label><input id="nmPass" placeholder="كلمة مرور العضو"></div>
    <div class="field"><label>رقم الواتساب</label><input id="nmWa" placeholder="9665xxxxxxxx"></div>
    <button class="btn btn-primary btn-block" onclick="submitAddMember()"><i class="fa-solid fa-circle-plus"></i> إضافة العضو</button>
  </div>`;
  document.body.appendChild(wrap); Sound.open();
}
async function submitAddMember(){
  const title=document.getElementById("nmTitle").value.trim();
  const rank=document.getElementById("nmRank").value.trim()||"عضو";
  const id=document.getElementById("nmId").value.trim();
  const balance=Number(document.getElementById("nmBalance").value)||0;
  const pass=document.getElementById("nmPass").value;
  const wa=document.getElementById("nmWa").value.trim();
  if(!title||!id||!pass){ toast("عبّي الحقول الأساسية","error"); return; }
  try{
    await DB.addMember({id,title,rank,balance,password:pass,whatsapp:wa});
    document.getElementById("addMemberModal").remove();
    toast("تمت إضافة العضو بنجاح","success");
    renderTabBody();
  }catch(e){ toast(e.message,"error"); }
}
function openAdjustBalance(id){
  let wrap = document.getElementById("adjModal"); if(wrap) wrap.remove();
  wrap=document.createElement("div"); wrap.className="modal-bg show"; wrap.id="adjModal";
  wrap.innerHTML=`<div class="modal">
    <div class="modal-head"><h3><i class="fa-solid fa-coins"></i> تعديل الرصيد</h3><button class="modal-close" onclick="document.getElementById('adjModal').remove()"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="field"><label>المبلغ (استخدم إشارة سالبة للخصم)</label><input id="adjAmt" type="number" placeholder="مثال: 500 أو -500-"></div>
    <div class="field"><label>ملاحظة</label><input id="adjNote" placeholder="سبب التعديل"></div>
    <button class="btn btn-primary btn-block" onclick="submitAdjust('${id}')"><i class="fa-solid fa-check"></i> تنفيذ</button>
  </div>`;
  document.body.appendChild(wrap); Sound.open();
}
async function submitAdjust(id){
  const amt = Number(document.getElementById("adjAmt").value);
  const note = document.getElementById("adjNote").value.trim();
  if(!amt){ toast("أدخل مبلغًا","error"); return; }
  await DB.adjustBalance(id, amt, amt>0?"admin_add":"admin_deduct", note, "مسؤول البنك");
  document.getElementById("adjModal").remove();
  toast("تم تحديث الرصيد","success");
  renderTabBody();
}
async function toggleFreeze(id, status){
  await DB.updateMember(id, {status: status==="frozen"?"active":"frozen"});
  toast(status==="frozen"?"تم تفعيل الحساب":"تم تجميد الحساب","info");
  renderTabBody();
}

render();
</script>
</body>
</html>

<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>محفظة العضو — نقابة الزمرد</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link rel="stylesheet" href="shared/base.css"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="shared/tailwind-config.js"></script>
</head>
<body class="bg-background font-body-md text-on-surface antialiased">

<header class="fixed top-0 w-full z-50 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.4)]">
  <div class="h-16 w-full px-gutter-lg flex items-center justify-between gap-gutter-md">
    <a href="index.html" class="flex items-center gap-gutter-xs text-primary font-headline-sm text-headline-sm">
      <span class="material-symbols-outlined">diamond</span> نقابة الزمرد
    </a>
    <button id="logoutBtn" class="flex items-center gap-gutter-xs text-on-surface-variant hover:text-on-surface text-body-sm">
      <span class="material-symbols-outlined text-[18px]">logout</span> خروج
    </button>
  </div>
</header>

<main class="w-full pt-24 pb-gutter-xl max-w-3xl mx-auto px-gutter-lg flex flex-col gap-gutter-lg">

  <h1 class="font-headline-md text-headline-md text-primary" id="welcomeMsg">مرحباً بعودتك</h1>

  <!-- بطاقة الهوية والرصيد -->
  <div class="bg-surface-container/70 backdrop-blur-xl rounded-xl p-gutter-lg shadow-xl flex flex-col md:flex-row items-center justify-between gap-gutter-md">
    <div class="flex flex-col gap-1">
      <span class="font-body-sm text-body-sm text-on-surface-variant">اللقب</span>
      <h2 class="font-headline-sm text-headline-sm text-on-surface" id="memberNickname">—</h2>
      <span class="font-label-cyber text-label-cyber text-secondary-fixed" id="memberIdText">—</span>
      <span class="font-body-sm text-body-sm text-on-surface-variant" id="memberRank">—</span>
    </div>
    <div class="flex flex-col items-center">
      <span class="font-body-sm text-body-sm text-on-surface-variant">الرصيد المتاح</span>
      <span class="font-headline-lg text-headline-lg text-primary" id="memberBalance">0</span>
      <span class="font-body-sm text-body-sm text-on-surface-variant">EMD</span>
    </div>
  </div>

  <!-- أزرار العمليات -->
  <div class="grid grid-cols-3 gap-gutter-sm">
    <button id="btnDeposit" class="flex flex-col items-center justify-center gap-1 py-gutter-sm rounded-xl bg-primary-container/10 border border-primary-container/40 text-primary-container text-body-sm font-headline-sm">
      <span class="material-symbols-outlined">arrow_upward</span> طلب إيداع
    </button>
    <button id="btnWithdraw" class="flex flex-col items-center justify-center gap-1 py-gutter-sm rounded-xl bg-surface-container-low border border-outline-variant/40 text-on-surface text-body-sm font-headline-sm">
      <span class="material-symbols-outlined">arrow_downward</span> طلب سحب
    </button>
    <button id="btnTransfer" class="flex flex-col items-center justify-center gap-1 py-gutter-sm rounded-xl bg-surface-container-low border border-outline-variant/40 text-on-surface text-body-sm font-headline-sm">
      <span class="material-symbols-outlined">sync_alt</span> تحويل
    </button>
  </div>

  <!-- الطلبات المعلقة -->
  <div class="flex flex-col gap-gutter-sm">
    <h3 class="font-headline-sm text-headline-sm text-on-surface">الطلبات المعلقة وموافقة الإدارة</h3>
    <div id="pendingList" class="flex flex-col gap-gutter-xs"></div>
    <p id="pendingEmpty" class="text-body-sm text-on-surface-variant eg-hidden">لا توجد طلبات معلقة حالياً.</p>
  </div>

  <!-- سجل العمليات -->
  <div class="flex flex-col gap-gutter-sm">
    <h3 class="font-headline-sm text-headline-sm text-on-surface">آخر العمليات المصرفية</h3>
    <div id="historyList" class="flex flex-col gap-gutter-xs"></div>
    <p id="historyEmpty" class="text-body-sm text-on-surface-variant eg-hidden">لا توجد عمليات سابقة.</p>
  </div>

</main>

<!-- مودال طلب عملية -->
<div id="txModal" class="eg-modal-backdrop eg-hidden">
  <div class="w-full max-w-sm bg-surface-container-high rounded-xl p-gutter-lg shadow-2xl border border-outline-variant/40">
    <div class="flex items-center justify-between mb-gutter-md">
      <h3 id="txModalTitle" class="font-headline-md text-headline-sm text-on-surface">طلب عملية</h3>
      <button data-close-modal="txModal" class="text-on-surface-variant hover:text-on-surface"><span class="material-symbols-outlined">close</span></button>
    </div>
    <form id="txForm" class="flex flex-col gap-gutter-md">
      <input type="hidden" id="txType"/>
      <div id="transferToWrap" class="eg-hidden">
        <label class="font-body-sm text-body-sm text-on-surface-variant mb-1 block">أيدي العضو المستلم (#EMD-xxxx)</label>
        <input id="txToMemberId" type="text" placeholder="#EMD-0000" class="w-full bg-surface-container-low border border-outline-variant/50 rounded-lg px-gutter-md py-gutter-sm text-on-surface focus:outline-none focus:border-primary-container"/>
      </div>
      <div>
        <label class="font-body-sm text-body-sm text-on-surface-variant mb-1 block">المبلغ (EMD)</label>
        <input required id="txAmount" type="number" min="1" class="w-full bg-surface-container-low border border-outline-variant/50 rounded-lg px-gutter-md py-gutter-sm text-on-surface focus:outline-none focus:border-primary-container"/>
      </div>
      <div>
        <label class="font-body-sm text-body-sm text-on-surface-variant mb-1 block">ملاحظة (اختياري)</label>
        <input id="txNote" type="text" class="w-full bg-surface-container-low border border-outline-variant/50 rounded-lg px-gutter-md py-gutter-sm text-on-surface focus:outline-none focus:border-primary-container"/>
      </div>
      <button type="submit" class="w-full bg-primary-container text-on-primary-container font-headline-sm py-gutter-sm rounded-lg hover:bg-primary-fixed transition-colors">إرسال الطلب للإدارة</button>
    </form>
  </div>
</div>

<script src="shared/db.js"></script>
<script src="shared/auth.js"></script>
<script src="shared/ui.js"></script>
<script>
const session = EGAuth.requireRole('member', 'index.html');
let currentMember = null;

function openModal(id){ document.getElementById(id).classList.remove('eg-hidden'); }
function closeModal(id){ document.getElementById(id).classList.add('eg-hidden'); }
document.querySelectorAll('[data-close-modal]').forEach(btn => btn.addEventListener('click', () => closeModal(btn.dataset.closeModal)));

document.getElementById('logoutBtn').addEventListener('click', () => EGAuth.logout('index.html'));

function openTxModal(type) {
  document.getElementById('txType').value = type;
  const titles = { deposit: 'طلب إيداع رصيد', withdraw: 'طلب سحب رصيد', transfer: 'تحويل إلى عضو آخر' };
  document.getElementById('txModalTitle').textContent = titles[type];
  document.getElementById('transferToWrap').classList.toggle('eg-hidden', type !== 'transfer');
  openModal('txModal');
}
document.getElementById('btnDeposit').addEventListener('click', () => openTxModal('deposit'));
document.getElementById('btnWithdraw').addEventListener('click', () => openTxModal('withdraw'));
document.getElementById('btnTransfer').addEventListener('click', () => openTxModal('transfer'));

document.getElementById('txForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const type = document.getElementById('txType').value;
  const amount = Number(document.getElementById('txAmount').value);
  const note = document.getElementById('txNote').value.trim();
  const toMemberId = document.getElementById('txToMemberId').value.trim();

  if (type === 'transfer' && !toMemberId) { EGUI.toast('يرجى إدخال أيدي العضو المستلم', 'error'); return; }
  if (type === 'withdraw' && amount > currentMember.balance) { EGUI.toast('الرصيد غير كافٍ لهذا السحب', 'error'); return; }

  await EGDB.requestTransaction(currentMember.id, type, amount, note, toMemberId);
  EGUI.toast('تم إرسال طلبك، بانتظار موافقة إدارة البنك');
  closeModal('txModal');
  document.getElementById('txForm').reset();
  await refresh();
});

function statusBadge(status) {
  const map = {
    pending: '<span class="text-body-sm px-gutter-sm py-1 rounded-full bg-accent-gold/10 text-[#f5b041] border border-[#f5b041]/30">قيد المراجعة</span>',
    approved: '<span class="text-body-sm px-gutter-sm py-1 rounded-full bg-primary-container/10 text-primary-container border border-primary-container/30">موافق عليه</span>',
    rejected: '<span class="text-body-sm px-gutter-sm py-1 rounded-full bg-error/10 text-error border border-error/30">مرفوض</span>'
  };
  return map[status] || status;
}
function typeLabel(t) {
  return { deposit: 'إيداع', withdraw: 'سحب', transfer: 'تحويل' }[t] || t;
}

async function refresh() {
  currentMember = await EGDB.getMemberById(session.memberDbId);
  if (!currentMember) { EGAuth.logout('index.html'); return; }

  document.getElementById('welcomeMsg').textContent = `مرحباً بعودتك، ${currentMember.nickname}`;
  document.getElementById('memberNickname').textContent = currentMember.nickname;
  document.getElementById('memberIdText').textContent = currentMember.memberId;
  document.getElementById('memberRank').textContent = currentMember.rank;
  document.getElementById('memberBalance').textContent = EGUI.formatNumber(currentMember.balance);

  const txs = await EGDB.listTransactionsForMember(currentMember.id);
  const pending = txs.filter(t => t.status === 'pending');
  const done = txs.filter(t => t.status !== 'pending');

  document.getElementById('pendingList').innerHTML = pending.map(t => `
    <div class="flex items-center justify-between bg-surface-container-low rounded-lg p-gutter-sm">
      <div class="flex flex-col">
        <span class="font-body-md text-body-md text-on-surface">${typeLabel(t.type)} — ${EGUI.formatNumber(t.amount)} EMD</span>
        <span class="font-body-sm text-body-sm text-on-surface-variant">${new Date(t.date).toLocaleString('ar')}</span>
      </div>
      ${statusBadge(t.status)}
    </div>`).join('');
  document.getElementById('pendingEmpty').classList.toggle('eg-hidden', pending.length > 0);

  document.getElementById('historyList').innerHTML = done.map(t => `
    <div class="flex items-center justify-between bg-surface-container-low rounded-lg p-gutter-sm">
      <div class="flex flex-col">
        <span class="font-body-md text-body-md text-on-surface">${typeLabel(t.type)} — ${EGUI.formatNumber(t.amount)} EMD</span>
        <span class="font-body-sm text-body-sm text-on-surface-variant">${new Date(t.date).toLocaleString('ar')}</span>
      </div>
      ${statusBadge(t.status)}
    </div>`).join('');
  document.getElementById('historyEmpty').classList.toggle('eg-hidden', done.length > 0);
}

if (session) refresh();
</script>
</body>
</html>

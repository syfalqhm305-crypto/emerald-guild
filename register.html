ceholder="6 أحرف على الأقل"><p class="hint mt-2">تأكيد البريد الإلكتروني يعتمد على إعدادات Auth في مشروع Supabase.</p><button class="btn" type="submit">تقديم طلب التسجيل</button></form><div class="mt-5 text-center text-sm hint">لديك حساب؟ <a class="text-[#39ffc3]" href="bank.html">دخول البنك</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script src="js/app.js"></script></body></html>
